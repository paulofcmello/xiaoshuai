<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>订单 Order — {{NOME}}</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500;125,900&family=Poppins:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="atacado.css?v=11">
</head>
<body class="pedido">
<header class="ohead"><span class="logo">{{LOGO}}</span><h1>订单 <small>Order</small></h1></header>
<main class="order" id="app"><p class="snote">加载中… Loading…</p></main>

<script>
// página que o fornecedor abre pelo link da mensagem: o pedido vem no próprio link (#p=...), sem servidor
const PERS={{PRECO_PERS}}, PATCH={{PRECO_PATCH}}, COTACAO={{COTACAO}}, FRETE={{FRETE}}, GRATIS=FRETE.length+1;
const frete=n=>Math.round((FRETE[n-1]||0)*COTACAO*100)/100;
const brl=v=>"R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
function ler(){
  try{
    const b=location.hash.match(/p=([\w-]+)/)[1].replace(/-/g,"+").replace(/_/g,"/");
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))));
  }catch{return null}
}
addEventListener("hashchange",()=>location.reload());  // outro pedido na mesma aba
const app=document.getElementById("app"), itens=ler();
if(!itens||!itens.length){app.innerHTML=`<p class="snote">链接无效或订单为空。<br>This order link is invalid or empty.</p>`}
else fetch("catalog.json").then(r=>r.json()).then(all=>{
  const byH={};all.forEach(x=>byH[x.h]=x);
  let n=0,sub=0;
  const cards=itens.map(([h,size,nome,num,q,patch])=>{
    const x=byH[h];q=Math.max(1,+q||1);n+=q;
    if(!x)return `<article class="oc"><div class="ob"><p>${esc(h)} · 尺码 Size: ${esc(size)} · ×${q}</p><p class="snote">商品已下架 Item no longer in catalog</p></div></article>`;
    const pl=(x.qe||"").split(" · ").includes("Player"), p=x.p+((nome||num)?PERS:0)+(+patch||0)*PATCH;sub+=p*q;
    const ver=pl?"球员版 Player version":x.t.startsWith("Camisa")?"球迷版 Fan version":"";
    const extra=(x.qz||"").split(" · ").filter(v=>v&&v!="球员版").join(" · ");
    return `<article class="oc">
      <img src="fotos/all/${x.h}.webp" alt="" width="440" height="440">
      <div class="ob">
        <h2>${esc(x.tz)}</h2><p class="oen">${esc(x.te)}</p>
        ${ver?`<p class="over">${ver}</p>`:""}${extra?`<p class="oex">${esc(extra)}</p>`:""}
        <dl>
          <dt>尺码 Size</dt><dd>${esc(size)}</dd>
          ${nome?`<dt>名字 Name</dt><dd>${esc(nome)}</dd>`:""}
          ${num?`<dt>号码 Number</dt><dd>${esc(num)}</dd>`:""}
          ${+patch?`<dt>臂章 Patch</dt><dd>×${+patch}</dd>`:""}
          <dt>数量 Qty</dt><dd>${q}</dd>
          <dt>价格 Price</dt><dd>${brl(p*q)}</dd>
        </dl>
        ${x.u?`<a class="olink" href="${esc(x.u)}" target="_blank" rel="noopener">相册 Album ↗</a>`:""}
      </div></article>`}).join("");
  const f=frete(n);
  app.innerHTML=cards+`<section class="osum">
    <p><span>球衣 Shirts (${n})</span><b>${brl(sub)}</b></p>
    <p><span>运费 Shipping</span><b>${f?brl(f):"免运费 Free"}</b></p>
    <p class="otot"><span>合计 Total</span><b>${brl(sub+f)}</b></p>
    ${itens.some(i=>+i[5])?`<p class="snote" style="color:var(--red)">客户会发送臂章图片 Customer will send the patch photo</p>`:""}
    ${(!PERS&&itens.some(i=>i[2]||i[3]))?`<p class="snote">定制费用另议 Customization price to confirm</p>`:""}
  </section>`;
});
</script>
</body>
</html>
