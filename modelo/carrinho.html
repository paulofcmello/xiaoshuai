<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrinho — {{NOME}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<nav class="top"><div class="wrap">
  <a class="logo" href="index.html">{{LOGO}}</a>
  <div class="links"><a href="index.html#l-brasileirao" data-en="Clubs" data-zh="俱乐部">Clubes</a><a href="index.html#l-selecoes" data-en="National teams" data-zh="国家队">Seleções</a><a href="index.html#loja" data-en="Catalog" data-zh="目录">Catálogo</a></div>
  <a class="cart" href="carrinho.html" aria-current="page"><span id="cartlabel">Carrinho</span> <b id="count">0</b></a>
</div></nav>

<main class="cartpage"><div class="wrap">
  <h1 id="title">Seu carrinho</h1>
  <div id="app"></div>
</div></main>

<footer><div class="wrap">
  <span class="logo">{{LOGO}}</span>
  <span>Mockup de demonstração · Demo · 演示样稿</span>
</div></footer>

<script>
const WA="https://wa.me/{{WA}}";
const lg=(()=>{try{return localStorage.lang||"pt"}catch{return"pt"}})();
const T=(pt,cn,en)=>lg=="zh"?cn:lg=="en"?(en??pt):pt;
const brl=v=>"R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2});
const $=id=>document.getElementById(id);
document.documentElement.lang={pt:"pt-BR",en:"en",zh:"zh-CN"}[lg]||"pt-BR";
if(lg!="pt")document.querySelectorAll("[data-zh]").forEach(e=>e.innerHTML=e.dataset[lg]??e.innerHTML);
$("cartlabel").textContent=T("Carrinho","购物车","Cart");$("title").textContent=T("Seu carrinho","购物车","Your cart");
let cart=(()=>{try{return JSON.parse(localStorage.cart||"[]")}catch{return[]}})();
const save=()=>{try{localStorage.cart=JSON.stringify(cart)}catch{}};
let byH={};

// group identical shirt+size into one line with a quantity
function lines(){const m=new Map();cart.forEach(c=>{const k=c.h+"|"+c.size;m.set(k,{...c,q:(m.get(k)?.q||0)+1})});return[...m.values()]}

// sempre em inglês: o fornecedor não lê português. WhatsApp só aceita texto (sem fotos nem links com nome), então vai a URL do álbum
const brlEn=v=>"R$ "+v.toFixed(2);
// frete em dólar por pedido: FRETE[n-1] para n camisas; acima da lista é grátis
const COTACAO={{COTACAO}}, FRETE={{FRETE}}, GRATIS=FRETE.length+1, freteUsd=n=>FRETE[n-1]||0, frete=n=>Math.round(freteUsd(n)*COTACAO*100)/100;
function message(ls,sub){const n=cart.length,f=frete(n);
  return ["Hi! I'd like to place this order from the {{NOME}} site:","",
    ...ls.map(l=>{const x=byH[l.h];return `• ${l.q}x ${x.te}${x.qe?" ("+x.qe+")":""} — size ${l.size} — ${brlEn(x.p*l.q)}`+(x.u?`\n   ${x.u}`:"")}),
    "",`Shirts: ${brlEn(sub)} (${n} ${n==1?"shirt":"shirts"})`,
    `Shipping: ${f?brlEn(f):`free (${GRATIS}+ shirts)`}`,
    `Total: ${brlEn(sub+f)}`,
    `Rate: 1 USD = ${COTACAO} BRL`].join("\n");
}

function render(){
  $("count").textContent=cart.length;
  const ls=lines(), sub=cart.reduce((s,c)=>s+byH[c.h].p,0), f=frete(cart.length), total=sub+f;
  if(!ls.length){$("app").innerHTML=`<div class="empty"><p>${T("Seu carrinho está vazio. Escolha uma camisa e o tamanho para ela aparecer aqui.","购物车是空的。选择球衣和尺码后会显示在这里。","Your cart is empty. Pick a shirt and a size and it will show up here.")}</p><a class="btn primary" href="index.html#loja">${T("Ver catálogo","查看目录","Browse catalog")}</a></div>`;return}
  $("app").innerHTML=`<div class="layout">
    <div class="items">${ls.map(l=>{const x=byH[l.h];if(!x)return"";return `
      <div class="item">
        <a href="camisa.html?id=${x.h}"><img src="fotos/all/${x.h}.webp" alt="${x.t}" width="96" height="96"></a>
        <div><h2><a href="camisa.html?id=${x.h}">${T(x.t,x.tz,x.te)}</a></h2><p>${[T(x.q,x.qz,x.qe),T("Tamanho","尺码","Size")+" "+l.size].filter(Boolean).join(" · ")}</p>
          <div class="qty"><button data-a="-" data-k="${l.h}|${l.size}" aria-label="${T("Diminuir","减少","Decrease")}">−</button><output>${l.q}</output><button data-a="+" data-k="${l.h}|${l.size}" aria-label="${T("Aumentar","增加","Increase")}">+</button></div></div>
        <div class="right">${brl(x.p*l.q)}<button class="rm" data-a="x" data-k="${l.h}|${l.size}">${T("Remover","删除","Remove")}</button></div>
      </div>`}).join("")}</div>
    <aside class="summary">
      <div class="row"><span>${T("Camisas","球衣","Shirts")} (${cart.length})</span><span>${brl(sub)}</span></div>
      <div class="row"><span>${T("Frete","运费","Shipping")}</span><span>${f?brl(f):T("Grátis","免运费","Free")}</span></div>
      ${cart.length<GRATIS?`<p class="note" style="min-height:0;margin:0 0 4px">${T(`Frete grátis a partir de ${GRATIS} camisas`,`满 ${GRATIS} 件免运费`,`Free shipping from ${GRATIS} shirts`)}</p>`:""}
      <div class="row total"><span>${T("Total","合计","Total")}</span><b>${brl(total)}</b></div>
      <a class="btn wa" id="wa" href="${WA}?text=${encodeURIComponent(message(ls,sub))}" target="_blank" rel="noopener">${T("Falar com fornecedor","联系供应商","Message the seller")}</a>
      <p class="note">${T("Abre o WhatsApp com seu pedido já escrito. É só enviar.","将打开 WhatsApp，订单已自动填写，直接发送即可。","Opens WhatsApp with your order already written. Just hit send.")}</p>
    </aside></div>`;
}

document.addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(!b)return;
  const [h,size]=b.dataset.k.split("|"),i=cart.findIndex(c=>c.h==h&&c.size==size);
  if(b.dataset.a=="+")cart.push({h,size});
  else if(b.dataset.a=="-"&&i>-1)cart.splice(i,1);
  else if(b.dataset.a=="x")cart=cart.filter(c=>!(c.h==h&&c.size==size));
  save();render();
});

fetch("catalog.json").then(r=>r.json()).then(all=>{all.forEach(x=>byH[x.h]=x);cart=cart.filter(c=>byH[c.h]);render()});
</script>
</body>
</html>
